# Builds the shinylive (WebAssembly) export and publishes it to GitHub
# Pages. shinylive resolves each dependency by reading the locally
# installed package's DESCRIPTION, so the app's packages have to be
# installed on the runner even though nothing here actually runs the
# app — that is why this job installs more than just shinylive.
name: Deploy app to GitHub Pages

# Only changes that reach the exported site trigger a rebuild. Edits to
# docs, tests, or editor config do not.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Cache R library
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-${{ hashFiles('.github/workflows/deploy.yml') }}
          restore-keys: r-lib-${{ runner.os }}-

      - name: Install R packages
        shell: Rscript {0}
        run: |
          pkgs <- c("shinylive", "shiny", "bslib", "ggplot2",
                    "tibble", "readxl", "glue", "fs")
          missing <- pkgs[!pkgs %in% rownames(installed.packages())]
          if (length(missing) > 0) install.packages(missing)

      # The wasm runtime and package binaries are large and change only
      # when shinylive itself does, so the cache is keyed on its version
      # rather than on the app source.
      - name: Record shinylive version
        id: shinylive
        shell: Rscript {0}
        run: |
          cat(
            "version=", as.character(packageVersion("shinylive")), "\n",
            file = Sys.getenv("GITHUB_OUTPUT"), sep = "", append = TRUE
          )

      - name: Cache shinylive web assets
        uses: actions/cache@v5
        with:
          path: ~/.cache/shinylive
          key: shinylive-assets-${{ runner.os }}-${{ steps.shinylive.outputs.version }}

      # template_params sets the browser tab title; without it the
      # exported page is titled "Shiny App".
      - name: Export static site
        shell: Rscript {0}
        run: |
          shinylive::export(
            "app", "site",
            template_params = list(title = "BIO_SC 3700 Statistics")
          )
          stopifnot(file.exists("site/index.html"))
          stopifnot(any(grepl(
            "<title>BIO_SC 3700 Statistics</title>",
            readLines("site/index.html")
          )))

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
